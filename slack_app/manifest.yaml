# Slack app manifest for a local Company Brain dev app.
# Adapted from github.com/supermemoryai/company-brain (docs/slack-app-manifest.yaml).
# Usage: https://api.slack.com/apps -> Create New App -> From a manifest -> pick your
# sandbox workspace -> paste this file. See docs/SLACK.md.
# The running server also serves this manifest with its own URLs at /slack/manifest.json
# (generated by src/domain/slack/manifest.py; keep the two in sync).
#
# Before pasting, replace:
#   YOUR-TUNNEL.ngrok-free.app  -> your public tunnel hostname (Slack server -> your machine)
display_information:
  name: Company Brain (dev)
  description: Company knowledge graph on FalkorDB, local development
  background_color: "#000b36"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: company-brain
    always_online: true
oauth_config:
  # Multi-workspace install (/slack/oauth/install) and Sign in with Slack for the console.
  redirect_urls:
    - https://sharpie-iodine-girdle.ngrok-free.dev/slack/oauth/callback
    - https://sharpie-iodine-girdle.ngrok-free.dev/auth/slack/callback
  scopes:
    # Every extra scope is another line on the install consent screen.
    # channels:manage / channels:join / channels:write.invites create the #company-brain home
    # channel and add members to it; usergroups:read resolves @team mentions.
    bot:
      - app_mentions:read
      - channels:history
      - channels:join
      - channels:manage
      - channels:read
      - channels:write.invites
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - team:read
      - usergroups:read
      - users:read
      - users:read.email
    # Sign in with Slack (OpenID Connect) for the console. Never used to read Slack.
    user:
      - openid
      - email
      - profile
settings:
  event_subscriptions:
    # Server-to-server POST from Slack, must be your public tunnel.
    request_url: https://sharpie-iodine-girdle.ngrok-free.dev/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - member_joined_channel
      - member_left_channel
      - reaction_added
      - reaction_removed
      - team_join
      - user_change
      - channel_shared
      - channel_unshared
  interactivity:
    is_enabled: true
    request_url: https://sharpie-iodine-girdle.ngrok-free.dev/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
