# nginx for brain-vm. This directory is mounted read-only at /etc/nginx/brain.
# active.conf is a symlink, not in git: http.conf until certificates exist, then
# https.conf. bootstrap-tls.sh flips it; deploy.sh creates it as http.conf if missing.
# gdb-active.conf is another such symlink; see https.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # $uri, not $request: query strings stay out of the logs (/slack/oauth/install takes ?token=).
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    # Docker's DNS. Upstreams are variables resolved per request, so nginx starts and keeps
    # answering ACME challenges even while the backend or the browser is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The FalkorDB Browser (browser.conf, falkordb.* and gdb.*): limit_req runs before auth_basic,
    # so failed logins count too.
    limit_req_zone $binary_remote_addr zone=gdb:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=gdb_login:10m rate=6r/m;
    # The console (CONSOLE_ENABLED): sign-in and the OAuth callbacks are rare, so 10 a minute
    # per address; the console's JSON API, 10 a second.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=console_api:10m rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/brain/active.conf;
}
