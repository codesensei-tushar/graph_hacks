# Bootstrap site, used only until the certificate exists (see bootstrap-tls.sh).
# Answers ACME HTTP-01 challenges; nothing is served over plain HTTP.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
