# The FalkorDB Browser site: falkordb-browser:3000 behind two locks, this basic auth (user
# admin, password = Secret Manager GDB_BASIC_AUTH_PASSWORD), then FalkorDB's own password
# (FALKORDB_PASSWORD) in the browser's login form. Included by the falkordb.noobsurd.space
# server in https.conf, and by gdb.noobsurd.space while that name still serves the browser
# (gdb-active.conf, see https.conf).
auth_basic "FalkorDB Browser";
auth_basic_user_file /etc/nginx/brain/gdb.htpasswd;
# A page load fetches dozens of assets at once, hence the burst.
limit_req zone=gdb burst=200 nodelay;
client_max_body_size 50m;

set $browser http://falkordb-browser:3000;

# The browser's sign-in endpoint, where FalkorDB passwords are tried.
location /api/auth/callback/ {
    limit_req zone=gdb burst=200 nodelay;
    limit_req zone=gdb_login burst=5 nodelay;
    include /etc/nginx/brain/proxy.conf;
    include /etc/nginx/brain/websocket.conf;
    proxy_set_header Authorization "";
    proxy_pass $browser;
}

location / {
    include /etc/nginx/brain/proxy.conf;
    include /etc/nginx/brain/websocket.conf;
    # The basic-auth credentials stop here.
    proxy_set_header Authorization "";
    proxy_read_timeout 3600s;
    proxy_pass $browser;
}
