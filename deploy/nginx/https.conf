# Full site: HTTPS for brain.noobsurd.space (backend) and gdb.noobsurd.space (FalkorDB Browser).

# Port 80: ACME challenges for renewals; everything else goes to HTTPS.
server {
    listen 80;
    server_name brain.noobsurd.space gdb.noobsurd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Requests for any other name (IP scans, stray Host headers) get nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# brain.noobsurd.space -> backend:8000 (Slack at /slack/events and /slack/interactions).
server {
    listen 443 ssl;
    http2 on;
    server_name brain.noobsurd.space;
    include /etc/nginx/brain/tls.conf;

    set $backend http://backend:8000;

    # MCP streams responses: no buffering, long-lived reads.
    location /mcp {
        include /etc/nginx/brain/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $backend;
    }

    location / {
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }
}

# gdb.noobsurd.space -> falkordb-browser:3000, behind two locks: this basic auth
# (user admin, password = Secret Manager GDB_BASIC_AUTH_PASSWORD), then FalkorDB's own
# password (FALKORDB_PASSWORD) in the browser's login form.
server {
    listen 443 ssl;
    http2 on;
    server_name gdb.noobsurd.space;
    include /etc/nginx/brain/tls.conf;

    auth_basic "FalkorDB Browser";
    auth_basic_user_file /etc/nginx/brain/gdb.htpasswd;
    # A page load fetches dozens of assets at once, hence the burst.
    limit_req zone=gdb burst=200 nodelay;
    client_max_body_size 50m;

    set $browser http://falkordb-browser:3000;

    # The browser's sign-in endpoint, where FalkorDB passwords are tried.
    location /api/auth/callback/ {
        limit_req zone=gdb burst=200 nodelay;
        limit_req zone=gdb_login burst=5 nodelay;
        include /etc/nginx/brain/proxy.conf;
        include /etc/nginx/brain/websocket.conf;
        proxy_set_header Authorization "";
        proxy_pass $browser;
    }

    location / {
        include /etc/nginx/brain/proxy.conf;
        include /etc/nginx/brain/websocket.conf;
        # The basic-auth credentials stop here.
        proxy_set_header Authorization "";
        proxy_read_timeout 3600s;
        proxy_pass $browser;
    }
}
