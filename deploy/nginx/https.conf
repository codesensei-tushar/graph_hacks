# Full site: HTTPS for brain.noobsurd.space (backend) and falkordb.noobsurd.space (FalkorDB Browser,
# formerly gdb.noobsurd.space, which redirects there once the certificate covers the new name).

# Port 80: ACME challenges for renewals; everything else goes to HTTPS.
server {
    listen 80;
    server_name brain.noobsurd.space falkordb.noobsurd.space gdb.noobsurd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Requests for any other name (IP scans, stray Host headers) get nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# brain.noobsurd.space -> backend:8000 (Slack at /slack/events and /slack/interactions).
server {
    listen 443 ssl;
    http2 on;
    server_name brain.noobsurd.space;
    include /etc/nginx/brain/tls.conf;

    set $backend http://backend:8000;

    # MCP streams responses: no buffering, long-lived reads.
    location /mcp {
        include /etc/nginx/brain/proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass $backend;
    }

    # The org console and Slack sign-in (CONSOLE_ENABLED in the app): rate-limited per address,
    # with a strict CSP (console-headers.conf).
    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location /console/oauth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location /console/api/ {
        limit_req zone=console_api burst=40 nodelay;
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location /console/ {
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location = /console {
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location = /signin {
        include /etc/nginx/brain/console-headers.conf;
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }

    location / {
        include /etc/nginx/brain/proxy.conf;
        proxy_pass $backend;
    }
}

# falkordb.noobsurd.space -> the FalkorDB Browser (browser.conf: basic auth, the gdb rate limits).
server {
    listen 443 ssl;
    http2 on;
    server_name falkordb.noobsurd.space;
    include /etc/nginx/brain/tls.conf;
    include /etc/nginx/brain/browser.conf;
}

# gdb.noobsurd.space, the old name. gdb-active.conf is a symlink, not in git: browser.conf
# (serve the browser here too, as before) until the certificate covers falkordb.noobsurd.space,
# then gdb-redirect.conf (301 to falkordb.*). deploy.sh creates it as browser.conf if missing;
# `bootstrap-tls.sh --ensure` flips it once the certificate is expanded.
server {
    listen 443 ssl;
    http2 on;
    server_name gdb.noobsurd.space;
    include /etc/nginx/brain/tls.conf;
    include /etc/nginx/brain/gdb-active.conf;
}
